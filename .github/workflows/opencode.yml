name: opencode

# Интерактивный агент: отвечает на команду в issue, PR или в комментарии к строке diff.
# Автотриаж: новое issue разбирается по prompt без команды человека.
# Схема авторизации стандартная: id-token обменивается на токен GitHub App OpenCode,
# поэтому checkout не сохраняет credentials, а комментарии и push делает приложение.
#
# issue_comment опасен тем, что запускается в контексте основной ветки с секретами.
# Поэтому job фильтрует автора (только OWNER/MEMBER/COLLABORATOR), игнорирует ботов
# и никогда не запускает код fork: checkout берёт основную ветку, а не PR из fork.
on:
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # Только команда из mentions, только от участника с правом записи и никогда от ботов.
    if: |
      github.event_name != 'issues' &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout читает репозиторий; push и комментарии идут токеном приложения
      id-token: write # OIDC-обмен на токен GitHub App OpenCode
      issues: write # gh в скиллах читает и публикует issue (спеки и тикеты)
      pull-requests: write # gh в скиллах читает PR и открывает драфт-PR на implement-spec
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }} # gh в скиллах читает и публикует issue/PR
        with:
          model: opencode/deepseek-v4.1-flash
          mentions: "/opencode,/oc"
          share: false

  triage:
    # Автотриаж нового issue: только доверенный автор, не бот и не готовый тикет.
    # Метка ready-for-agent отделяет тикеты to-spec/to-tickets от входящих обращений.
    if: |
      github.event_name == 'issues' &&
      github.event.issue.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout читает репозиторий; комментарии идут токеном приложения
      id-token: write # OIDC-обмен на токен GitHub App OpenCode
      issues: write # gh публикует разбор и ставит метки
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode triage
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }} # gh читает issue, комментирует и ставит метки
        with:
          model: opencode/deepseek-v4.1-flash
          share: false
          prompt: |
            Разбери новое обращение #${{ github.event.issue.number }}.

            1. Прочитай описание и все комментарии: gh issue view ${{ github.event.issue.number }} --comments.
            2. Сверься с текущим приложением по коду и документации: README.md, GLOSSARY.md,
               spec/main.tsp, backend/internal, frontend/src, e2e. Не выдумывай существующее поведение.
            3. Перепроверь метки через gh issue view ${{ github.event.issue.number }} --json labels.
               Если есть ready-for-agent (тикет, подготовленный to-spec/to-tickets), ничего не комментируй и не меняй.
            4. Опубликуй комментарий с предварительным разбором: категория (bug/enhancement/documentation),
               что уже умеет приложение, каких условий не хватает, 1-3 вопроса автору, следующий шаг.
               Код, спецификацию и тикеты не создавай.
            5. Поставь метки по docs/agents/triage-labels.md: needs-triage, needs-info или ready-for-agent,
               плюс категорию по смыслу. Не дублируй уже стоящие метки.
