name: opencode

# Интерактивный агент: отвечает на команду в issue, PR или в комментарии к строке diff.
# Автотриаж: новое issue разбирается по prompt без команды человека.
# Схема авторизации стандартная: id-token обменивается на токен GitHub App OpenCode,
# поэтому checkout не сохраняет credentials, а комментарии и push делает приложение.
#
# Бюджет: job budget считает допущенные запуски по истории Actions до вызова модели.
# Авторевью живёт отдельно в pr-review.yml и не запускает правки.
on:
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

run-name: "opencode #${{ github.event.issue.number || github.event.pull_request.number }}"

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  budget:
    # Только команда из mentions, только от участника с правом записи и никогда от ботов.
    # Для обычного issue бюджет не нужен: считаются только PR.
    if: |
      github.event_name != 'issues' &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # история запусков и run_attempt — источник бюджета
      contents: read # checkout скрипта подсчёта
      issues: write # комментарий об исчерпании или инфраструктуре
      pull-requests: write # комментарий в PR
    outputs:
      allowed: ${{ steps.budget.outputs.allowed }}
      is_pr: ${{ steps.budget.outputs.is_pr }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Скрипт бюджета должен приходить из доверенной основной ветки даже
          # для pull_request_review_comment, где checkout по умолчанию берёт PR.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check budget before model call
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null }}
          CURRENT_RUN: ${{ github.run_id }}
          CURRENT_ATTEMPT: ${{ github.run_attempt }}
          MAX_RUNS: "3"
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            {
              echo "allowed=false"
              echo "reason=infra"
              echo "count=0"
              echo "is_pr=$IS_PR"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$IS_PR" != "true" ]; then
            {
              echo "allowed=true"
              echo "reason="
              echo "count=0"
              echo "is_pr=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            node scripts/agent-budget.mjs \
              --repo "$REPO" \
              --pr "$PR_NUMBER" \
              --current-run "$CURRENT_RUN" \
              --current-attempt "$CURRENT_ATTEMPT" \
              --max "$MAX_RUNS"
            echo "is_pr=true"
          } >> "$GITHUB_OUTPUT"

      - name: Report blocked or infrastructure run
        if: steps.budget.outputs.allowed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.budget.outputs.reason }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ steps.budget.outputs.is_pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$REASON" = "limit_exhausted" ]; then
            title="Бюджет запусков исчерпан"
            detail="Причина: \`limit_exhausted\`. Лимит: 3 допущенных запуска на PR."
          else
            title="Агент не запущен: infra"
            detail="Причина: \`infra\`. Проверьте секрет \`OPENCODE_API_KEY\` и подготовку инструмента."
          fi

          if [ "$IS_PR" = "true" ]; then
            sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid 2>/dev/null || echo "unknown")
          else
            sha="n/a"
          fi

          {
            printf '**%s**\n\n' "$title"
            printf '%s\n\n' "$detail"
            printf -- "- Последний SHA: \`%s\`\n" "$sha"
            printf -- '- Логи: %s\n' "$RUN_URL"
            printf -- '- Статус: нужен человек\n\n'
            printf '%s\n' 'Бюджет считается по истории Actions; этот комментарий — только отчёт.'
          } > /tmp/budget-report.md

          if [ "$IS_PR" = "true" ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/budget-report.md
          else
            gh issue comment "$PR_NUMBER" --body-file /tmp/budget-report.md
          fi

  opencode:
    needs: budget
    if: needs.budget.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout читает репозиторий; push и комментарии идут токеном приложения
      id-token: write # OIDC-обмен на токен GitHub App OpenCode
      issues: write # gh в скиллах читает и публикует issue (спеки и тикеты)
      pull-requests: write # gh в скиллах читает PR и открывает драфт-PR на implement-spec
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }} # gh в скиллах читает и публикует issue/PR
        with:
          model: opencode/deepseek-v4.1-flash
          mentions: "/opencode,/oc"
          share: false

  report:
    # Итог публикует отдельное задание без модели: timeout и agent_failed.
    # limit_exhausted и infra публикует budget до вызова модели.
    needs: [budget, opencode]
    if: |
      always() &&
      needs.budget.outputs.allowed == 'true' &&
      needs.opencode.result != 'success' &&
      needs.opencode.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Report agent failure
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.opencode.result }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ needs.budget.outputs.is_pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RESULT" = "cancelled" ]; then
            reason="timeout"
            detail="Причина: \`timeout\`. Задание остановлено по тайм-ауту или отменено."
          else
            reason="agent_failed"
            detail="Причина: \`agent_failed\`. Проверьте логи; при неопределённой причине решение принимает человек."
          fi

          if [ "$IS_PR" = "true" ]; then
            sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid 2>/dev/null || echo "unknown")
          else
            sha="n/a"
          fi

          {
            printf '**Агент завершился без успеха**\n\n'
            printf '%s\n\n' "$detail"
            printf -- "- Причина: \`%s\`\n" "$reason"
            printf -- "- Последний SHA: \`%s\`\n" "$sha"
            printf -- '- Логи: %s\n' "$RUN_URL"
            printf -- '- Статус: нужен человек\n'
          } > /tmp/agent-report.md

          if [ "$IS_PR" = "true" ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/agent-report.md
          else
            gh issue comment "$PR_NUMBER" --body-file /tmp/agent-report.md
          fi

  triage:
    # Автотриаж нового issue: только доверенный автор, не бот и не готовый тикет.
    # Метка ready-for-agent отделяет тикеты to-spec/to-tickets от входящих обращений.
    if: |
      github.event_name == 'issues' &&
      github.event.issue.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout читает репозиторий; комментарии идут токеном приложения
      id-token: write # OIDC-обмен на токен GitHub App OpenCode
      issues: write # gh публикует разбор и ставит метки
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode triage
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }} # gh читает issue, комментирует и ставит метки
        with:
          model: opencode/deepseek-v4.1-flash
          share: false
          prompt: |
            Разбери новое обращение #${{ github.event.issue.number }}.

            1. Прочитай описание и все комментарии: gh issue view ${{ github.event.issue.number }} --comments.
            2. Сверься с текущим приложением по коду и документации: README.md, GLOSSARY.md,
               spec/main.tsp, backend/internal, frontend/src, e2e. Не выдумывай существующее поведение.
            3. Перепроверь метки через gh issue view ${{ github.event.issue.number }} --json labels.
               Если есть ready-for-agent (тикет, подготовленный to-spec/to-tickets), ничего не комментируй и не меняй.
            4. Опубликуй комментарий с предварительным разбором: категория (bug/enhancement/documentation),
               что уже умеет приложение, каких условий не хватает, 1-3 вопроса автору, следующий шаг.
               Код, спецификацию и тикеты не создавай.
            5. Поставь метки по docs/agents/triage-labels.md: needs-triage, needs-info или ready-for-agent,
               плюс категорию по смыслу. Не дублируй уже стоящие метки.
