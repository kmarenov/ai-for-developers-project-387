name: opencode

# Интерактивный агент: отвечает на команду в issue, PR или в комментарии к строке diff.
# Схема авторизации стандартная: id-token обменивается на токен GitHub App OpenCode,
# поэтому checkout не сохраняет credentials, а комментарии и push делает приложение.
#
# issue_comment опасен тем, что запускается в контексте основной ветки с секретами.
# Поэтому job фильтрует автора (только OWNER/MEMBER/COLLABORATOR), игнорирует ботов
# и никогда не запускает код fork: checkout берёт основную ветку, а не PR из fork.
on:
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # Только команда из mentions, только от участника с правом записи и никогда от ботов.
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout читает репозиторий; push и комментарии идут токеном приложения
      id-token: write # OIDC-обмен на токен GitHub App OpenCode
      issues: write # gh в скиллах читает и публикует issue (спеки и тикеты)
      pull-requests: write # gh в скиллах читает PR и открывает драфт-PR на implement-spec
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }} # gh в скиллах читает и публикует issue/PR
        with:
          model: opencode/deepseek-v4.1-flash
          mentions: "/opencode,/oc"
          share: false
